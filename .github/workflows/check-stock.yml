name: Check iPhone stock

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay scheduled runs at busy times)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to publish status.json to the "status" branch

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Load previous status
        run: |
          if git fetch --depth=1 origin status 2>/dev/null; then
            git show origin/status:status.json > prev_status.json 2>/dev/null || echo '{}' > prev_status.json
          else
            echo '{}' > prev_status.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Apple pickup availability
        env:
          APPLE_ZIP: ${{ secrets.APPLE_ZIP }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python checker/check_stock.py --config config.json --prev prev_status.json --out status.json

      - name: Publish status.json to the status branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p publish && cp status.json publish/
          cd publish
          git init -q -b status
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add status.json
          git commit -qm "status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status
